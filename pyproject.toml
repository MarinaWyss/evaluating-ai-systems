[project]
name = "beefcake-evals-workshop"
version = "0.1.0"
description = "Code for the Evaluating AI Systems workshop: the BeefCake Fitness support bot and its evals."
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "pandas>=2.0",
    "jupyter",
]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools]
packages = ["beefcake"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
